<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/avatar/badawy.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mohamed Badawy — Software Engineer & Systems Architect</title>
    <meta name="description" content="Portfolio of Mohamed Badawy (M7MEDpro). Backend systems with Java & Spring Boot, cross-platform Flutter engineering, and connected IoT telemetry." />
    
    <!-- OpenGraph / Social Meta -->
    <meta property="og:title" content="Mohamed Badawy — Software Engineer & Systems Architect" />
    <meta property="og:description" content="Backend systems, cross-platform Flutter engineering, and connected IoT telemetry." />
    <meta property="og:image" content="/avatar/badawy.png" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#151a24" />

    <!-- Google Fonts: Bricolage Grotesque + Figtree + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;600;700;800&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Theme initialization script to prevent FOUC -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('badawy-theme');
          var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-accent/20 selection:text-accent overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
